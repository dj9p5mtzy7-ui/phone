R.ig=()=>`<div class="s ig"><div class=igh><span style="font-weight:300">＋</span><span style="font-family:'Snell Roundhand','Brush Script MT',cursive;font-size:30px;font-style:italic;font-weight:700">Instagram</span><span>♡</span></div><div class=stl><div class="stc me"><span><i class=av style="background-color:#7ad9cf"></i></span>내 스토리</div>${IG.map((g,i)=>`<div class=stc onclick="go('sv',${i})"><span style="${SEEN[i]?'background:#c7c7cc':''}"><i class=av style="background-color:#7ad9cf"></i></span>${g.id.length>11?g.id.slice(0,10)+'…':g.id}</div>`).join('')}</div><div class=ls>${post(0,0)}</div>${nv()}</div>`;
R.sv=i=>{const g=IG[i];SEEN[i]=1;tm.push(setTimeout(()=>go('ig'),5200));return`<div class=s style="background:#000;padding:0"><div class=svi style="background-image:url(${g.st})"></div><div style="position:absolute;top:50px;left:0;right:0;padding:0 12px"><div class=pb><i></i></div><div style="display:flex;align-items:center;gap:8px;margin-top:10px;color:#fff;font-size:14px"><span class=av style="width:34px;height:34px;border-radius:50%;background:#7ad9cf" onclick="go('ip',${i})"></span><b onclick="go('ip',${i})">${g.id}</b><small style="opacity:.7">6시간</small><b style="margin-left:auto;font-size:22px" onclick="go('ig')">✕</b></div></div>${g.txt?`<div style="position:absolute;left:0;right:0;bottom:200px;text-align:center;color:#fff;font-size:15px;text-shadow:0 0 6px #000">${g.txt}</div>`:''}<div class=sm2><span>메시지 보내기…</span><b onclick="tg(this,'s${i}')" style="${LK['s'+i]?'color:#ed4956':''}">${LK['s'+i]?'♥':'♡'}</b><b>➤</b></div></div>`};
R.ip=i=>{const g=IG[i];return`<div class="s ig"><div class=hd><b onclick="go('ig')">‹</b><span>${g.id}</span><b style="font-size:20px;width:auto">⋯</b></div><div class=ls><div style="display:flex;align-items:center;gap:22px;padding:8px 16px"><span style="width:86px;height:86px;border-radius:50%;padding:3px;background:${SEEN[i]?'#c7c7cc':'linear-gradient(45deg,#fdc468,#d62976,#962fbf)'};flex:none"><span class=av style="display:block;width:100%;height:100%;border-radius:50%;border:3px solid #fff;background:#7ad9cf"></span></span><div style="display:flex;gap:26px;text-align:center;flex:1;justify-content:center"><div><b>${g.ps.length}</b><br><small>게시물</small></div><div><b>${i?'52':'128'}</b><br><small>팔로워</small></div><div><b>${i?'61':'96'}</b><br><small>팔로잉</small></div></div></div><div style="padding:0 16px 8px;font-size:13px"><b>${g.n||g.id}</b><br>${g.bio}</div><div style="display:flex;gap:8px;padding:0 16px 12px"><span class=bt>팔로잉 ⌄</span><span class=bt>메시지</span></div><div class=pg>${g.ps.map((p,k)=>`<img src="${p}" onclick="go('po',[${i},${k}])">`).join('')}</div>${g.ps.length?'':'<div style="text-align:center;color:#888;padding:40px">아직 게시물이 없습니다</div>'}</div>${nv()}</div>`};
R.po=a=>`<div class="s ig"><div class=hd><b onclick="go('ip',${a[0]})">‹</b><span>게시물</span><b></b></div><div class=ls>${post(a[0],a[1])}</div></div>`;
R.ck=()=>`<div class="s dk"><div class=big>9:02</div><p style="text-align:center;color:#aaa;margin-top:8px">오후 · 서울</p></div>`;
R.wt=()=>{const hr=[['지금','☁',15],['오후 10시','☁',14],['오후 11시','☾',14],['오전 12시','☾',13],['오전 1시','☁',13],['오전 2시','☾',12]],dy=[['오늘','☁ 45%',12,21],['목','☀',11,19],['금','☁',12,20],['토','☂ 65%',13,20],['일','☂',13,20]],bar=(a,b)=>`<div class=bar><i style="left:${(a-10)/14*100}%;width:${(b-a)/14*100}%"></i></div>`;return`<div class="s wtr"><div style="text-align:center;margin-top:30px;font-size:15px">나의 위치</div><div style="text-align:center;font-size:38px">서울</div><div style="text-align:center;font-size:96px;font-weight:200;line-height:1.1">15°</div><div style="text-align:center;font-size:17px;font-weight:500;margin-bottom:30px">대체로 흐림<br>최고:21° 최저:12°</div><div class=cd><b>기상 상태</b><br><small style="opacity:.6">온도(°C)</small><div class=hr>${hr.map(x=>`<div><b>${x[0]}</b><span style="font-size:22px">${x[1]}</span><b>${x[2]}°</b></div>`).join('')}</div></div><div class=cd>${dy.map(d=>`<div class=dr><b>${d[0]}</b><span>${d[1]}</span><small style="opacity:.6">${d[2]}°</small>${bar(d[2],d[3])}<b>${d[3]}°</b></div>`).join('')}</div><div class=wb><span>▦</span><em>➤ ● ● ● ●</em><span>☰</span></div></div>`};
let tm=[];function go(id,a){tm.forEach(clearTimeout);tm=[];$('#c').innerHTML=(R[id]||R.home)(a);if(id=='kc')$('#ms').scrollTop=1e5}go('lk');
</script></body></html>
